# burninginsight.com 反向代理：80 只做 ACME 校验与跳转，业务全走 443。
# www 统一 301 到裸域（GitHub 登录回调只登记了裸域，避免会话对不上）。
# 证书由 certbot 容器签发并自动续期，文件在 certbot-conf 卷里。

server {
    listen 80;
    server_name burninginsight.com www.burninginsight.com;

    # Let's Encrypt webroot 校验
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://burninginsight.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name burninginsight.com;

    ssl_certificate     /etc/letsencrypt/live/burninginsight.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/burninginsight.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;

    client_max_body_size 4m;

    location / {
        # 走 compose 内网直接连应用容器，不经过宿主机端口
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}

# www 只做跳转，不直接提供页面
server {
    listen 443 ssl http2;
    server_name www.burninginsight.com;

    ssl_certificate     /etc/letsencrypt/live/burninginsight.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/burninginsight.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    return 301 https://burninginsight.com$request_uri;
}
