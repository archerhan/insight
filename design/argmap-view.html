    return (
      '<button type="button" class="' + cls + '" data-id="' + id + '" data-state="' + esc(n.state || "") + '">' +
        '<span class="n-top"><span class="n-text">' + esc(n.text) + "</span></span>" +
        '<span class="n-meta">' + esc(n.author) + " · 判断力 " + n.score + stateMini(n) + "</span>" +
      "</button>"
    );
  }

  function renderMap() {
    var n = NODES[focus];
    var parent = PARENTS[focus];
    var kids = CHILDREN[focus] || { pro: [], con: [] };

    parentBand.innerHTML = parent
      ? '<div><div class="band-label">上一级论点 · ' + (NODES[parent].role === "root" ? "主论点" : NODES[parent].rel === "pro" ? "支持方" : "反对方") + "</div>" + nodeCard(parent, "parent") + "</div>"
      : "";
    focusBand.innerHTML = '<div style="width:100%">' + nodeCard(focus, "focus") + "</div>";

    function column(list, rel, headEl, nodesEl, empty) {
      headEl.querySelector(".cnt").textContent = "(" + list.length + ")";
      nodesEl.innerHTML = list.length
        ? list.map(function (id) { return nodeCard(id, "child"); }).join("")
        : '<div class="empty-hint">' + empty + "</div>";
    }
    column(kids.pro, "pro", proHead, proNodes, "暂无支撑理由");
    column(kids.con, "con", conHead, conNodes, "暂无反驳");

    focusLabel.innerHTML = "当前聚焦：<strong>" + esc(n.text) + "</strong>" + (parent ? " · 它是" + (n.rel === "pro" ? "支撑" : "反驳") + "上一级论点" : " · 议题层主论点");
    renderContext(n, parent);
    refreshOutline();
    requestAnimationFrame(function () { setTimeout(layoutEdges, 0); });
  }

  function layoutEdges() {
    var canvasRect = mapArea.getBoundingClientRect();
    if (!canvasRect.width) return;
    edgeLayer.setAttribute("width", canvasRect.width);
    edgeLayer.setAttribute("height", canvasRect.height);
    edgeLayer.setAttribute("viewBox", "0 0 " + canvasRect.width + " " + canvasRect.height);
    edgeLayer.innerHTML = "";

    var NS = "http://www.w3.org/2000/svg";
    var defs = document.createElementNS(NS, "defs");
    edgeLayer.appendChild(defs);
    var styleVars = getComputedStyle(mapArea);
    function cssColor(v) {
      return styleVars.getPropertyValue(v).trim();
    }

    function center(id, edge) {
      var el = mapArea.querySelector('[data-id="' + id + '"]');
      if (!el) return null;
      var r = el.getBoundingClientRect();
      return {
        x: r.left + r.width / 2 - canvasRect.left,
        y: edge === "top" ? r.top - canvasRect.top : r.bottom - canvasRect.top
      };
    }

    function path(points, color) {
      var p = document.createElementNS(NS, "path");
      p.setAttribute("d", "M " + points[0].x + " " + points[0].y + " C " + points[0].x + " " + (points[0].y + 14) + ", " + points[1].x + " " + (points[1].y - 14) + ", " + points[1].x + " " + points[1].y);
      p.setAttribute("fill", "none");
      p.setAttribute("stroke", color);
      p.setAttribute("stroke-width", "1.5");
      p.setAttribute("opacity", "0.75");
      edgeLayer.appendChild(p);
    }

    function endpointDot(x, y, color) {
      var c = document.createElementNS(NS, "circle");
      c.setAttribute("cx", x);
      c.setAttribute("cy", y);
      c.setAttribute("r", "2.5");
      c.setAttribute("fill", color);
      edgeLayer.appendChild(c);
    }

    var parent = PARENTS[focus];
    var fTop = center(focus, "top");
    var fBot = center(focus, "bottom");
    if (parent && fTop) {
      var pBot = center(parent, "bottom");
      if (pBot) {
        var pColor = NODES[focus].rel === "pro" ? cssColor("--am-pro") : cssColor("--am-con");
        path([pBot, fTop], pColor);
        endpointDot(fTop.x, fTop.y, pColor);
      }
    }
    var kids = CHILDREN[focus] || { pro: [], con: [] };
    ["pro", "con"].forEach(function (rel) {
      var color = rel === "pro" ? cssColor("--am-pro") : cssColor("--am-con");
      (kids[rel] || []).forEach(function (id) {
        var cTop = center(id, "top");
        if (fBot && cTop) {
          path([fBot, cTop], color);
          endpointDot(cTop.x, cTop.y, color);
        }
      });
    });
  }

  function renderContext(n, parent) {
    var relNote = parent
      ? (n.rel === "pro" ? "支撑它的上一级论点" : "反驳它的上一级论点")
      : "议题层主论点";
    var stateHtml = n.state
      ? '<span class="mini-state ' + esc(n.state) + '">' + esc(n.stateText) + "</span>"
      : '<span class="mini-state">进行中</span>';
    ctxBody.innerHTML =
      '<div class="ctx-title">' + esc(n.text) + "</div>" +
      stateHtml +
      '<div class="ctx-meta" style="margin-top:6px">' + esc(n.author) + " · 判断力 " + n.score + "</div>" +
      '<div class="ctx-tags">' + n.tags.map(function (t) { return '<span class="tag">' + esc(t) + "</span>"; }).join("") + "</div>" +
      '<span class="ev"><i data-lucide="file-text" aria-hidden="true"></i> ' + esc(n.evidence) + "</span>" +
      '<div class="kv"><span class="k">在树中的角色</span><span>' + relNote + "</span></div>" +
      '<div class="kv"><span class="k">直接下级</span><span>' + ((CHILDREN[focus] ? CHILDREN[focus].pro.length + CHILDREN[focus].con.length : 0)) + " 个</span></div>" +
      '<div class="rec-list">' + recordsFor(focus) + "</div>" +
      '<div class="actions">' +
        '<button type="button" class="primary">在对线中打开</button>' +
        '<button type="button" class="ghost">标记</button>' +
      "</div>";
    if (window.lucide && window.lucide.createIcons) {
      try { lucide.createIcons({ attrs: { width: 14, height: 14 } }); } catch (e) {}
    }
  }

  function recordsFor(id) {
    var recs = [];
    if (id === "c1") recs.push({ d: "08-21", t: "被采纳进结论书（v2）" });
    if (id === "c2") recs.push({ d: "08-18", t: "数据核验通过，被采纳" });
    if (id === "cc1") recs.push({ d: "08-23", t: "被 ccc1 击穿" });
    if (id === "ccc1") recs.push({ d: "08-23", t: "击穿 cc1，已采纳" });
    if (id === "ccc2") recs.push({ d: "09-02", t: "挂红 5 天，等待回应" });
    if (id === "m1") recs.push({ d: "进行中", t: "仍有 1 条未决反驳影响结论" });
    if (!recs.length) recs.push({ d: "无", t: "尚无裁决记录" });
    return recs.map(function (r) {
      return '<div class="rec"><span class="d">' + esc(r.d) + "</span> · " + esc(r.t) + "</div>";
    }).join("");
  }

  function renderOutline() {
    function walk(id, depth) {
      var n = NODES[id];
      var html =
        '<button type="button" class="o-node' + (id === focus ? " active" : "") + '" data-id="' + id + '" data-state="' + esc(n.state || "") + '" style="padding-left:' + (8 + depth * 14) + 'px">' +
          '<span class="dot ' + dotClass(n) + '"></span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;max-width:calc(100% - 14px);vertical-align:bottom">' + esc(n.text) + "</span>" +
        "</button>";
      var kids = CHILDREN[id] || { pro: [], con: [] };
      var childIds = kids.pro.concat(kids.con);
      return html + childIds.map(function (c) { return walk(c, depth + 1); }).join("");
    }
    outlineTree.innerHTML = walk(ROOT, 0);
  }

  function refreshOutline() {
    renderOutline();
    applyFilter();
    Array.prototype.forEach.call(outlineTree.querySelectorAll(".o-node"), function (b) {
      b.addEventListener("click", function () {
        focus = b.getAttribute("data-id");
        renderMap();
      });
    });
  }

  function applyFilter() {
    var nodes = mapArea.querySelectorAll(".node");
    Array.prototype.forEach.call(nodes, function (el) {
      var st = el.getAttribute("data-state");
      el.classList.toggle("dim", !!filter && st !== filter);
    });
    Array.prototype.forEach.call(outlineTree.querySelectorAll(".o-node"), function (el) {
      var st = el.getAttribute("data-state");
      el.classList.toggle("dim", !!filter && st !== filter);
    });
  }

  function renderTimeline() {
    timePane.innerHTML = EVENTS.map(function (e) {
      return (
        '<div class="tl-item">' +
          '<span class="tl-dot ' + esc(e.type) + '"></span>' +
          '<div class="tl-date">' + esc(e.date) + "</div>" +
          '<div class="tl-text">' + esc(e.text) + "</div>" +
          '<div class="tl-src">' + esc(e.src) + "</div>" +
        "</div>"
      );
    }).join("");
  }

  function setMode(m) {
    mode = m;
    Array.prototype.forEach.call(document.querySelectorAll("#argmap-mockup .map-head [data-mode]"), function (b) {
      var on = b.getAttribute("data-mode") === m;
      b.classList.toggle("active", on);
      b.setAttribute("aria-pressed", on ? "true" : "false");
    });
    mapPane.hidden = m !== "map";
    timePane.hidden = m !== "time";
    if (m === "time") renderTimeline();
    else requestAnimationFrame(function () { setTimeout(layoutEdges, 0); });
  }

  mapArea.addEventListener("click", function (e) {
    var nodeBtn = e.target.closest(".node[data-id]");
    if (!nodeBtn) return;
    var id = nodeBtn.getAttribute("data-id");
    if (id === focus) return;
    focus = id;
    renderMap();
  });

  Array.prototype.forEach.call(document.querySelectorAll("#argmap-mockup .filters button"), function (b) {
    b.addEventListener("click", function () {
      filter = b.getAttribute("data-filter") || "";
      Array.prototype.forEach.call(document.querySelectorAll("#argmap-mockup .filters button"), function (x) {
        var on = x === b;
        x.classList.toggle("active", on);
        x.setAttribute("aria-pressed", on ? "true" : "false");
      });
      applyFilter();
    });
  });

  Array.prototype.forEach.call(document.querySelectorAll("#argmap-mockup .map-head [data-mode]"), function (b) {
    b.addEventListener("click", function () { setMode(b.getAttribute("data-mode")); });
  });

  var resizeTimer = null;
  window.addEventListener("resize", function () {
    if (mode !== "map") return;
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      if (mode === "map") layoutEdges();
    }, 150);
  });

  renderMap();
})();
</script>
</div>
