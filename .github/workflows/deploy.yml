name: Deploy

# 触发：CI（quality 门禁）在 main 上跑通后自动发布；也可在 Actions 页手动触发。
# PR 分支的 CI 不会触发部署（branches 过滤的是触发工作流的分支）。
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  # workflow_run 触发时用被触发的那个 commit；手动触发时用当前分支 HEAD
  RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      app_image: ${{ steps.meta.outputs.app_image }}
      migrate_image: ${{ steps.meta.outputs.migrate_image }}
    steps:
      - name: 计算镜像地址
        id: meta
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
        run: |
          set -euo pipefail
          if [ -z "${ACR_REGISTRY:-}" ] || [ -z "${ACR_NAMESPACE:-}" ]; then
            echo "::error::缺少 ACR_REGISTRY / ACR_NAMESPACE secret"
            exit 1
          fi
          REPO="$ACR_REGISTRY/$ACR_NAMESPACE/debate"
          {
            echo "app_image=$REPO:$RELEASE_SHA"
            # 迁移镜像与运行镜像同仓库不同标签，免去再建一个 ACR 仓库
            echo "migrate_image=$REPO:$RELEASE_SHA-migrate"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/setup-buildx-action@v3

      - name: 登录 ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: 构建并推送运行镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.app_image }}
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/debate:latest
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: 构建并推送迁移镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrator
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.migrate_image }}
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/debate:latest-migrate
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,mode=max,scope=migrate

      - name: 发布摘要
        run: |
          {
            echo "### 镜像已推送"
            echo ""
            echo "- commit: \`$RELEASE_SHA\`"
            echo "- 运行镜像: \`${{ steps.meta.outputs.app_image }}\`"
            echo "- 迁移镜像: \`${{ steps.meta.outputs.migrate_image }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 检查是否配置了服务器
        id: check
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          if [ -z "${SSH_HOST:-}" ]; then
            echo "::notice::未配置 SSH_HOST，跳过自动部署；镜像已推送到 ACR，可在服务器手动拉取"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.enabled == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: 准备 SSH
        if: steps.check.outputs.enabled == 'true'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: 同步编排文件到服务器
        if: steps.check.outputs.enabled == 'true'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SSH_APP_DIR: ${{ secrets.SSH_APP_DIR || '/opt/debate' }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "mkdir -p '$SSH_APP_DIR/docker'"
          scp -i ~/.ssh/id_deploy -P "$SSH_PORT" \
            docker-compose.yml "$SSH_USER@$SSH_HOST:$SSH_APP_DIR/docker-compose.yml"
          scp -i ~/.ssh/id_deploy -P "$SSH_PORT" \
            docker/scheduler.mjs "$SSH_USER@$SSH_HOST:$SSH_APP_DIR/docker/scheduler.mjs"

      - name: 拉取镜像并重启服务
        if: steps.check.outputs.enabled == 'true'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SSH_APP_DIR: ${{ secrets.SSH_APP_DIR || '/opt/debate' }}
          APP_IMAGE: ${{ needs.build.outputs.app_image }}
          MIGRATE_IMAGE: ${{ needs.build.outputs.migrate_image }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            APP_IMAGE="$APP_IMAGE" MIGRATE_IMAGE="$MIGRATE_IMAGE" APP_DIR="$SSH_APP_DIR" \
            'bash -s' <<'REMOTE'
          set -euo pipefail
          cd "$APP_DIR"
          if [ ! -f .env.production ]; then
            echo "缺少 $APP_DIR/.env.production，请先按 deploy/server-setup.md 创建" >&2
            exit 1
          fi
          export APP_IMAGE MIGRATE_IMAGE
          docker compose --env-file .env.production pull app migrate
          docker compose --env-file .env.production up -d --no-build
          docker image prune -f
          docker compose --env-file .env.production ps
          REMOTE
