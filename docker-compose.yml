# 本地与阿里云统一编排：Postgres 与应用同机（不再依赖 Neon）。
#
# 本地：
#   docker compose up -d --build                     # 构建镜像 + 起库 + 自动迁移 + 起应用
#   docker compose run --rm migrate pnpm db:seed     # 可选：写入演示数据
#
# 服务器（镜像由 CI 推到 ACR，服务器只负责拉取）：
#   APP_ENV_FILE=.env.production docker compose --env-file .env.production pull
#   APP_ENV_FILE=.env.production docker compose --env-file .env.production up -d --no-build
name: debate

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app-env: &app-env
  env_file:
    - ${APP_ENV_FILE:-.env.local}

services:
  db:
    # 国内服务器拉 Docker Hub 不稳定时，可把该镜像推到 ACR，再用 POSTGRES_IMAGE 覆盖
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-debate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-debate}
      POSTGRES_DB: ${POSTGRES_DB:-debate}
      TZ: Asia/Shanghai
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      # 只绑定回环地址，方便主机侧工具直连；公网无法访问
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-debate} -d ${POSTGRES_DB:-debate}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 512m

  # 一次性迁移任务：应用启动前跑完，失败则应用不会启动
  migrate:
    build:
      context: .
      target: migrator
    image: ${MIGRATE_IMAGE:-debate-migrate:local}
    <<: *app-env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-debate}:${POSTGRES_PASSWORD:-debate}@db:5432/${POSTGRES_DB:-debate}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    logging: *logging

  app:
    build:
      context: .
      target: runner
    image: ${APP_IMAGE:-debate-app:local}
    <<: *app-env
    environment:
      NODE_ENV: production
      # 覆盖 .env.local 中的连接串，指向 compose 内的 db 服务
      DATABASE_URL: postgresql://${POSTGRES_USER:-debate}:${POSTGRES_PASSWORD:-debate}@db:5432/${POSTGRES_DB:-debate}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    ports:
      # 服务器上配好反向代理后把 APP_BIND 设成 127.0.0.1，只允许本机 Nginx/Caddy 访问
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 768m

  # 替代 Vercel Cron：每日一次调用 /api/cron/advance 推进挑战阶段
  scheduler:
    # 复用应用镜像里的 Node，避免额外依赖 Docker Hub 的 node 镜像
    image: ${SCHEDULER_IMAGE:-debate-app:local}
    <<: *app-env
    environment:
      CRON_URL: http://app:3000/api/cron/advance
      CRON_HOUR_UTC: ${CRON_HOUR_UTC:-3}
      CRON_TICK_SECONDS: ${CRON_TICK_SECONDS:-300}
      TZ: UTC
    command: ["node", "/scheduler.mjs"]
    volumes:
      - ./docker/scheduler.mjs:/scheduler.mjs:ro
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped
    logging: *logging

  # ---- 以下两个服务属于 edge 档：证书签发完成后用 COMPOSE_PROFILES=edge 启用 ----
  # Nginx 反向代理：80 跳转 + ACME 校验，443 转发到 app:3000
  web:
    image: ${NGINX_IMAGE:-nginx:alpine}
    profiles: ["edge"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-conf:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      app:
        condition: service_started
    logging: *logging

  # Let's Encrypt 自动续期：每 12 小时检查一次，证书走 webroot 校验
  certbot:
    image: ${CERTBOT_IMAGE:-certbot/certbot}
    profiles: ["edge"]
    restart: unless-stopped
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'
    logging: *logging

volumes:
  db-data:
  certbot-conf:
  certbot-www:
